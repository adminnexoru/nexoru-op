name: CI

# Runs on every push to any branch (feature branches included), so a branch is tested as soon
# as it is pushed. PRs come from branches of this repo, and the check on the PR head commit is
# the one the main ruleset requires. No pull_request trigger, to avoid running everything twice.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, types, unit, db and e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test -- --passWithNoTests

      # Local Supabase (Postgres, Auth, Mailpit) in Docker. No GitHub secrets are used:
      # every key comes from the throwaway local stack.
      - name: Start local Supabase
        run: npx supabase start

      - name: Apply migrations
        run: npx supabase db reset

      - name: Database tests (pgTAP)
        run: |
          if ls supabase/tests/*.sql >/dev/null 2>&1; then
            npm run db:test
          else
            echo "No pgTAP tests yet"
          fi

      - name: Export local Supabase environment
        run: |
          status=$(npx supabase status -o json)
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(echo "$status" | jq -r '.API_URL')"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(echo "$status" | jq -r '.PUBLISHABLE_KEY // .ANON_KEY')"
            echo "SUPABASE_SECRET_KEY=$(echo "$status" | jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY')"
            echo "APP_URL=http://localhost:3000"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
            echo "SMTP_USER="
            echo "SMTP_PASSWORD="
            echo "EMAIL_FROM=Nexoru Op <no-reply@nexoru.ai>"
          } >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run test:e2e -- --pass-with-no-tests

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
